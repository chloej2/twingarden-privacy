<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TwinGarden 초대 · Invite</title>
<style>
  :root { color-scheme: light; }
  body { margin:0; font-family:-apple-system,"Segoe UI",Roboto,"Noto Sans KR",sans-serif;
    background:#F3F1EC; color:#1F3D2B; display:flex; min-height:100vh; align-items:center; justify-content:center; }
  .card { max-width:360px; margin:24px; padding:28px 24px; background:#fff; border-radius:24px;
    box-shadow:0 8px 28px rgba(31,61,43,.10); text-align:center; }
  .leaf { font-size:44px; }
  h1 { font-size:22px; margin:12px 0 4px; }
  p { font-size:15px; line-height:1.5; color:#4a5c50; margin:6px 0; }
  .btn { display:block; margin:18px 0 8px; padding:15px; border-radius:16px; background:#2E6B43; color:#fff;
    font-size:16px; font-weight:600; text-decoration:none; }
  .hint { font-size:13px; color:#7a8a80; margin-top:14px; }
  .en { color:#8a988f; font-size:13px; margin-top:2px; }
  .store { display:inline-block; margin-top:16px; font-size:13px; color:#2E6B43; text-decoration:none; }
</style>
</head>
<body>
  <div class="card">
    <div class="leaf">🌱</div>
    <h1>TwinGarden 초대</h1>
    <p>친구가 자기 화단으로 초대했어요.<br>아래 버튼으로 앱에서 열어보세요.</p>
    <p class="en">A friend invited you to their garden — open it in the app.</p>
    <a class="btn" id="open" href="#">앱에서 열기 · Open in app</a>
    <p class="hint" id="hint">앱이 안 열리면, 이 링크를 <b>Chrome 같은 기본 브라우저</b>에서 열어주세요.<br>
      <span class="en">Not opening? Open this link in Chrome (not an in-app browser).</span></p>
    <a class="store" href="https://play.google.com/store/apps/details?id=com.gardentwin.app">앱이 아직 없나요? · Get the app</a>
  </div>
<script>
  (function () {
    var t = new URLSearchParams(window.location.search).get('t') || '';
    // App Link data URI the installed app is registered to handle (host MUST be the real domain).
    var appUri = 'https://chloej2.github.io/twingarden-privacy/i/?t=' + encodeURIComponent(t);
    // intent:// with package pin — opens the installed app even from many in-app webviews.
    // No browser_fallback_url on purpose: a failed intent should stay on THIS page (with the
    // manual button + Chrome hint), not dump the user onto an unpublished Play Store listing.
    var intentUri = 'intent://chloej2.github.io/twingarden-privacy/i/?t=' + encodeURIComponent(t)
      + '#Intent;scheme=https;package=com.gardentwin.app;end';
    function openApp() { window.location.href = intentUri; setTimeout(function(){ /* stay on page */ }, 400); }
    document.getElementById('open').addEventListener('click', function (e) { e.preventDefault(); openApp(); });
    // Auto-attempt once on load.
    if (t) { openApp(); }
  })();
</script>
</body>
</html>
